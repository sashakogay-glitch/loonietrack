<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F4F0" />

    <!-- SEO -->
    <meta name="description" content="LoonieTrack is the money app for Canadian owner-operators, tradespeople, and self-employed workers. Scan receipts, track income and HST, and know exactly what to set aside for taxes — automatically, every time you get paid. So April never surprises you." />
    <link rel="canonical" href="https://loonietrack.ca/" />

    <!-- Open Graph (Facebook, LinkedIn, Messenger) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://loonietrack.ca/" />
    <meta property="og:title" content="LoonieTrack — Know what you owe. Before April does." />
    <meta property="og:description" content="The money app for Canadian owner-operators, tradespeople, and self-employed workers. Scan receipts, track HST, and know what to set aside for taxes — automatically." />
    <meta property="og:image" content="https://loonietrack.ca/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LoonieTrack — Know what you owe. Before April does." />
    <meta name="twitter:description" content="Scan receipts, track HST, and know what to set aside for taxes — automatically. Built for Canadian self-employed." />
    <meta name="twitter:image" content="https://loonietrack.ca/og-image.png" />

    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FLEPSHBMNS"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FLEPSHBMNS');
    </script>

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <!-- iOS home screen support -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LoonieTrack" />

    <!-- Android / Chrome standalone support -->
    <meta name="mobile-web-app-capable" content="yes" />

    <title>LoonieTrack — Tax & money app for Canadian self-employed</title>

    <!-- Capture the install prompt as early as possible, before React even loads,
         so we never miss the one-time event and the in-app Install button always works. -->
    <script>
      window.__deferredInstallPrompt = null;
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        window.__deferredInstallPrompt = e;
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch((err) => {
            console.error("Service worker registration failed:", err);
          });
        });
      }
    </script>
  </body>
</html>
