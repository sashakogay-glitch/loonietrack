    <!-- Capture the install prompt as early as possible, before React even loads,
         so we never miss the one-time event and the in-app Install button always works. -->
    <script>
      window.__deferredInstallPrompt = null;
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        window.__deferredInstallPrompt = e;
      });
    </script>
  <script>
(function(){
  function show(t){
    var d=document.createElement('pre');
    d.style.cssText='position:fixed;left:0;top:0;right:0;max-height:45%;z-index:99999;margin:0;background:#fff;color:#900;font:12px/1.4 monospace;padding:16px;white-space:pre-wrap;overflow:auto';
    d.textContent=t;
    (document.body||document.documentElement).appendChild(d);
  }
  window.addEventListener('error',function(e){ show('ERROR\n'+(e.message||'')+'\n'+(e.filename||'')+':'+(e.lineno||'')+'\n\n'+((e.error&&e.error.stack)||'')); });
  window.addEventListener('unhandledrejection',function(e){ show('PROMISE\n'+((e.reason&&(e.reason.stack||e.reason.message))||String(e.reason))); });
})();
</script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch((err) => {
            console.error("Service worker registration failed:", err);
          });
        });
      }
    </script>
  <script>
(function(){
  function show(t){
    var d=document.createElement('pre');
    d.style.cssText='position:fixed;left:0;top:0;right:0;max-height:45%;z-index:99999;margin:0;background:#fff;color:#900;font:11px/1.35 monospace;padding:14px;white-space:pre-wrap;overflow:auto';
    d.textContent=t;
    (document.body||document.documentElement).appendChild(d);
  }
  setTimeout(function(){
    var root=document.getElementById('root');
    
    var src=null, list=document.querySelectorAll('script[src]');
    for(var i=0;i<list.length;i++){ if(list[i].src.indexOf('/static/js/main')>-1) src=list[i].src; }
    var out='UA: '+navigator.userAgent+'\nURL: '+location.href+'\nbundle: '+src+'\nindexedDB: '+(typeof indexedDB)+'\n';
    try{ localStorage.setItem('t','1'); out+='localStorage: ok\n'; }catch(e){ out+='localStorage: FAIL '+e+'\n'; }
    if(!src){ show(out+'\nmain bundle not found'); return; }
    fetch(src).then(function(r){ return r.text(); }).then(function(code){
      out+='bundle bytes: '+code.length+'\n\n';
      try { (0,eval)(code); out+='eval: no error'; }
      catch(e){ out+='EVAL ERROR\n'+((e&&(e.stack||e.message))||e); }
      show(out);
    }).catch(function(e){ show(out+'\nfetch failed: '+e); });
  }, 2500);
})();
</script>
  </body>
